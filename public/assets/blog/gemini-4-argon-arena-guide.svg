        <text x="85" y="34" fill="#c4b5fd" font-size="15">CODE</text>
        <text x="85" y="70" fill="#ffffff" font-size="31">&lt;/&gt;</text>
        <circle cx="85" cy="122" r="20" fill="url(#violet)"/>
        <text x="85" y="129" fill="#ffffff" font-size="20">3</text>
