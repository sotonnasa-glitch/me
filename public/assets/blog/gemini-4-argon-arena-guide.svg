<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">آموزش انتخاب Gemini 4 Argon در Arena.ai</title>
  <desc id="desc">کاور مقاله تکویکس درباره انتخاب مدل Gemini 4 Argon در حالت Direct و بخش Code سایت Arena.ai با امکان استفاده رایگان محدود.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1b"/><stop offset=".55" stop-color="#0a1230"/><stop offset="1" stop-color="#160a32"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6d8cff" stroke-opacity=".09" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="34" fill="url(#grid)"/>
  <circle cx="1050" cy="105" r="180" fill="#2563eb" opacity=".15" filter="url(#soft)"/>
  <circle cx="175" cy="560" r="190" fill="#8b5cf6" opacity=".13" filter="url(#soft)"/>
  <path d="M0 145C220 40 335 80 470 0M790 675C900 540 1050 520 1200 570" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-width="2"/>
  <g transform="translate(70 52)">
